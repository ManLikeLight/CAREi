openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: care-plans
    description: AI-assisted care plan drafting and version history
  - name: care-assistant
    description: Grounded care guidance for carers
  - name: documents
    description: AI-assisted CAREi document drafting and confirmation
  - name: care-records
    description: Idempotent care record ingestion
  - name: reports
    description: Grounded manager report generation
  - name: family-updates
    description: Consent and in-app family visit updates
  - name: compliance
    description: Deterministic compliance evidence dashboard
paths:
  /ctp/jobs/escalate:
    post:
      operationId: escalateCtpConcerns
      summary: Dedicated scheduler credential only, never a staff or trusted-person session
      responses:
        "200": { description: Sample concern escalation sweep }
        "403": { description: Missing or invalid scheduler credential }
  /ctp/auth/session:
    get:
      operationId: getCtpSession
      responses:
        "200": { description: Sample session }
  /ctp/auth/activate:
    post:
      operationId: activateCtpInvite
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CtpActivationInput" } } }
      responses:
        "200": { description: Invitation redeemed and cookie set }
        "400": { description: Invalid code or password }
        "403": { description: "Code unavailable, expired, already used or not privately delivered" }
  /ctp/auth/recover:
    post:
      operationId: requestCtpInviteRecovery
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CtpRecoveryInput" } } }
      responses:
        "202": { description: Non-enumerating acknowledgement, content: { application/json: { schema: { $ref: "#/components/schemas/CtpInviteAcknowledgement" } } } }
        "400": { description: Invalid details }
        "403": { description: Same-origin request required }
        "429": { description: Request rate limited }
  /ctp/auth/login:
    post:
      operationId: loginCtp
      responses:
        "200": { description: Short-lived cookie set }
  /ctp/auth/logout:
    post:
      operationId: logoutCtp
      responses:
        "200": { description: Session revoked }
  /ctp/me/clients:
    get:
      operationId: getCtpClients
      responses:
        "200": { description: Active linked sample clients }
  /ctp/me/clients/{clientId}/today:
    parameters:
      - { name: clientId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCtpToday
      responses:
        "200": { description: No-store authorised categories only }
  /ctp/me/clients/{clientId}/concerns:
    parameters:
      - { name: clientId, in: path, required: true, schema: { type: string } }
    post:
      operationId: createCtpConcern
      responses:
        "201": { description: Concern received }
  /ctp/me/concerns:
    get:
      operationId: getCtpConcerns
      responses:
        "200": { description: Own concern status and timestamps only }
  /ctp/manager:
    get:
      operationId: getCtpManager
      responses:
        "200": { description: Agency-scoped sample manager console }
  /ctp/sample/setup:
    post:
      operationId: setupCtpSample
      responses:
        "200": { description: Fictional fixture created }
  /ctp/clients/{clientId}/trusted-people:
    parameters:
      - { name: clientId, in: path, required: true, schema: { type: string } }
    post:
      operationId: inviteCtpPerson
      responses:
        "201": { description: Sample link created awaiting separate verification; no credential issued }
  /ctp/links/{linkId}/invite:
    parameters:
      - { name: linkId, in: path, required: true, schema: { type: string } }
    post:
      operationId: sendVerifiedCtpInvite
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CtpVerifiedInviteInput" } } }
      responses:
        "202": { description: Provider accepted private code delivery, content: { application/json: { schema: { $ref: "#/components/schemas/CtpInviteAcknowledgement" } } } }
        "400": { description: Confirm out-of-band verification }
        "403": { description: Separate operator approval and active staff session required }
        "404": { description: Active agency link not found }
        "429": { description: Resend cooldown }
        "503": { description: Approved private delivery unavailable }
  /ctp/links/{linkId}/permissions:
    parameters:
      - { name: linkId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateCtpPermissions
      responses:
        "200": { description: Audited flags; sessions revoked }
  /ctp/links/{linkId}/preset:
    parameters:
      - { name: linkId, in: path, required: true, schema: { type: string } }
    post:
      operationId: applyCtpPreset
      responses:
        "200": { description: Client restrictions preserved }
  /ctp/links/{linkId}/status:
    parameters:
      - { name: linkId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateCtpStatus
      responses:
        "200": { description: Access changed; old sessions revoked }
  /ctp/links/{linkId}/audit:
    parameters:
      - { name: linkId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCtpAudit
      responses:
        "200": { description: Agency access audit }
  /ctp/concerns/{concernId}:
    parameters:
      - { name: concernId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateCtpConcern
      responses:
        "200": { description: Acknowledged or resolved with note }
  /ctp/settings:
    patch:
      operationId: updateCtpSettings
      responses:
        "200": { description: Agency sample settings saved }
  /ctp/carers/{carerId}/privacy:
    parameters:
      - { name: carerId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateCtpCarerPrivacy
      responses:
        "200": { description: Sample carer name and photo preference saved }
  /ctp/manager/visits:
    get:
      operationId: getCtpVisits
      responses:
        "200": { description: Sample visits and story versions }
  /ctp/manager/visits/{visitId}:
    parameters:
      - { name: visitId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCtpSources
      responses:
        "200": { description: Sample verified sources }
  /ctp/stories/{visitId}/regenerate:
    parameters:
      - { name: visitId, in: path, required: true, schema: { type: string } }
    post:
      operationId: regenerateCtpStory
      responses:
        "200": { description: Queued and versioned story regeneration }
  /ctp/sources/{sourceId}:
    parameters:
      - { name: sourceId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: correctCtpSource
      responses:
        "200": { description: Corrected sample fact and regenerated story }
  /compliance/dashboard:
    get:
      operationId: getComplianceDashboard
      tags: [compliance]
      summary: Get deterministic manager compliance dashboard
      responses:
        "200":
          description: Agency-scoped compliance evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceDashboard"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /care-plans/generate:
    post:
      operationId: generateCarePlan
      tags: [care-plans]
      summary: Generate a structured draft care plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCarePlanRequest"
      responses:
        "200":
          description: Generated draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft:
                    $ref: "#/components/schemas/CarePlanDraft"
                required: [draft]
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /care-plans/{clientId}/versions:
    parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
          minLength: 1
    get:
      operationId: getCarePlanVersions
      tags: [care-plans]
      summary: List prior confirmed care plan versions
      responses:
        "200":
          description: Version history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarePlanVersion"
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: confirmCarePlan
      tags: [care-plans]
      summary: Confirm and save a new care plan version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmCarePlanRequest"
      responses:
        "201":
          description: Saved version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarePlanVersion"
        "400":
          $ref: "#/components/responses/Error"
  /care-assistant/chat:
    post:
      operationId: chatWithCareAssistant
      tags: [care-assistant]
      summary: Ask the grounded CAREi guidance assistant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareAssistantRequest"
      responses:
        "200":
          description: Guidance response and audit reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareAssistantResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /documents/generate:
    post:
      operationId: generateDocument
      tags: [documents]
      summary: Generate an unsaved editable document draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentGenerationInput"
      responses:
        "200":
          description: Unsaved document draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDraft"
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /documents/confirm:
    post:
      operationId: confirmDocument
      tags: [documents]
      summary: Save a reviewed document as confirmed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentConfirmationInput"
      responses:
        "201":
          description: Confirmed document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedDocument"
        "400":
          $ref: "#/components/responses/Error"
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List generated documents
      parameters:
        - in: query
          name: userEmail
          schema:
            type: string
            format: email
        - in: query
          name: clientId
          schema:
            type: string
      responses:
        "200":
          description: Generated documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedDocument"
        "400":
          $ref: "#/components/responses/Error"
  /care-records/visits:
    post:
      operationId: ingestVisitRecord
      tags: [care-records]
      summary: Idempotently ingest a completed visit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitRecordInput"
      responses:
        "200":
          description: Existing or newly ingested visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitRecord"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /care-records/medications:
    post:
      operationId: ingestMedicationConfirmation
      tags: [care-records]
      summary: Idempotently ingest a medication confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicationConfirmationInput"
      responses:
        "200":
          description: Existing or newly ingested confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicationConfirmationRecord"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /family-updates/session:
    post:
      operationId: redeemFamilyInvite
      tags: [family-updates]
      summary: Exchange a one-time recipient invite for an HttpOnly family session
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FamilyInviteInput" } } }
      parameters:
        - { in: header, name: X-CAREi-Family, required: true, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: Recipient session established, content: { application/json: { schema: { $ref: "#/components/schemas/FamilyRecipient" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      operationId: getFamilySession
      tags: [family-updates]
      security: [{ familySession: [] }]
      responses:
        "200": { description: Authenticated recipient, content: { application/json: { schema: { $ref: "#/components/schemas/FamilyRecipient" } } } }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      operationId: endFamilySession
      tags: [family-updates]
      security: [{ familySession: [] }]
      parameters:
        - { in: header, name: X-CAREi-Family, required: true, schema: { type: string, enum: ["1"] } }
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /family-updates/consent:
    get:
      operationId: getFamilyUpdateConsent
      tags: [family-updates]
      security: [{ familySession: [] }]
      parameters:
        - { in: query, name: clientId, required: true, schema: { type: string } }
        - { in: query, name: familyMemberId, required: true, schema: { type: string } }
      responses:
        "200": { description: Consent, content: { application/json: { schema: { $ref: "#/components/schemas/FamilyUpdateConsentStatus" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateFamilyUpdateConsent
      tags: [family-updates]
      security: [{ familySession: [] }]
      parameters:
        - { in: header, name: X-CAREi-Family, required: true, schema: { type: string, enum: ["1"] } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FamilyUpdateConsentInput" } } }
      responses:
        "200": { description: Updated consent, content: { application/json: { schema: { $ref: "#/components/schemas/FamilyUpdateConsentStatus" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /family-updates:
    get:
      operationId: listFamilyUpdates
      tags: [family-updates]
      security: [{ familySession: [] }]
      parameters:
        - { in: query, name: clientId, required: true, schema: { type: string } }
        - { in: query, name: familyMemberId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sent updates, newest first
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FamilyUpdateDelivery" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /reports/generate:
    post:
      operationId: generateReport
      tags: [reports]
      summary: Generate and persist a grounded manager report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportGenerationInput"
      responses:
        "200":
          description: Persisted report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedReport"
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List generated reports
      parameters:
        - in: query
          name: userEmail
          schema:
            type: string
            format: email
        - in: query
          name: clientId
          schema:
            type: string
      responses:
        "200":
          description: Generated reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedReport"
        "400":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    familySession:
      type: apiKey
      in: cookie
      name: carei_family_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: CAREiAssistantSession
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    CarePlanSuggestion:
      type: object
      additionalProperties: false
      properties:
        suggestion:
          type: string
        source:
          type: [string, "null"]
      required: [suggestion, source]
    CarePlanDraft:
      type: object
      additionalProperties: false
      properties:
        personalDetailsAndPreferences:
          type: object
          additionalProperties: false
          properties:
            summary:
              $ref: "#/components/schemas/CarePlanSuggestion"
          required: [summary]
        needs:
          type: object
          additionalProperties: false
          properties:
            personalCare:
              $ref: "#/components/schemas/CarePlanSuggestion"
            mobility:
              $ref: "#/components/schemas/CarePlanSuggestion"
            nutrition:
              $ref: "#/components/schemas/CarePlanSuggestion"
            medication:
              $ref: "#/components/schemas/CarePlanSuggestion"
            social:
              $ref: "#/components/schemas/CarePlanSuggestion"
          required: [personalCare, mobility, nutrition, medication, social]
        identifiedRisks:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CarePlanSuggestion"
        goalsAndDesiredOutcomes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CarePlanSuggestion"
        dailyRoutine:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CarePlanSuggestion"
        notes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CarePlanSuggestion"
      required:
        - personalDetailsAndPreferences
        - needs
        - identifiedRisks
        - goalsAndDesiredOutcomes
        - dailyRoutine
        - notes
    CarePlanClient:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        age:
          type: integer
          minimum: 0
        address:
          type: string
      required: [name, age, address]
    GenerateCarePlanRequest:
      type: object
      additionalProperties: false
      properties:
        client:
          $ref: "#/components/schemas/CarePlanClient"
        assessmentInput:
          type: string
          minLength: 1
          maxLength: 20000
      required: [client, assessmentInput]
    ConfirmCarePlanRequest:
      type: object
      additionalProperties: false
      properties:
        assessmentInput:
          type: string
          minLength: 1
          maxLength: 20000
        plan:
          $ref: "#/components/schemas/CarePlanDraft"
      required: [assessmentInput, plan]
    CarePlanVersion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        clientId:
          type: string
        version:
          type: integer
        assessmentInput:
          type: string
        plan:
          $ref: "#/components/schemas/CarePlanDraft"
        confirmedBy:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - clientId
        - version
        - assessmentInput
        - plan
        - confirmedBy
        - createdAt
    CareAssistantClient:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          enum: [mary, tom, aisha]
        name:
          type: string
          minLength: 1
        carePlanContext:
          type: string
          minLength: 1
          maxLength: 20000
      required: [id, name, carePlanContext]
    CareAssistantRequest:
      type: object
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        client:
          $ref: "#/components/schemas/CareAssistantClient"
      required: [question]
    CareAssistantResponse:
      type: object
      additionalProperties: false
      properties:
        answer:
          type: string
        emergencyEscalation:
          type: boolean
        auditId:
          type: integer
      required: [answer, emergencyEscalation, auditId]
    DocumentSection:
      type: object
      additionalProperties: false
      properties:
        heading:
          type: string
        content:
          type: string
      required: [heading, content]
    DocumentClient:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
      required: [id, name]
    DocumentIdentity:
      type: object
      additionalProperties: false
      properties:
        userName:
          type: string
          minLength: 1
        userEmail:
          type: string
          format: email
        userRole:
          type: string
          enum: [carer, manager]
      required: [userName, userEmail, userRole]
    DocumentGenerationInput:
      type: object
      additionalProperties: false
      properties:
        templateType:
          type: string
          enum: [incident_report, care_assessment_summary, general_letter]
        freeText:
          type: string
          maxLength: 20000
        structuredDetails:
          type: object
          additionalProperties:
            type: string
        identity:
          $ref: "#/components/schemas/DocumentIdentity"
        client:
          $ref: "#/components/schemas/DocumentClient"
      required: [templateType, freeText, structuredDetails, identity]
    DocumentDraft:
      type: object
      additionalProperties: false
      properties:
        documentType:
          type: string
          enum: [incident_report, care_assessment_summary, general_letter]
        title:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSection"
      required: [documentType, title, sections]
    DocumentConfirmationInput:
      type: object
      additionalProperties: false
      properties:
        documentType:
          type: string
          enum: [incident_report, care_assessment_summary, general_letter]
        title:
          type: string
          minLength: 1
        sections:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DocumentSection"
        sourceDetails:
          type: object
          additionalProperties:
            type: string
        identity:
          $ref: "#/components/schemas/DocumentIdentity"
        client:
          $ref: "#/components/schemas/DocumentClient"
      required: [documentType, title, sections, sourceDetails, identity]
    GeneratedDocument:
      allOf:
        - $ref: "#/components/schemas/DocumentDraft"
        - type: object
          additionalProperties: false
          properties:
            id:
              type: integer
            status:
              type: string
              enum: [draft, confirmed]
            userName:
              type: string
            userEmail:
              type: string
            userRole:
              type: string
              enum: [carer, manager]
            clientId:
              type: [string, "null"]
            clientName:
              type: [string, "null"]
            sourceDetails:
              type: object
              additionalProperties:
                type: string
            confirmedAt:
              type: [string, "null"]
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required: [id, status, userName, userEmail, userRole, clientId, clientName, sourceDetails, confirmedAt, createdAt, updatedAt]
    VisitRecordInput:
      type: object
      additionalProperties: false
      properties:
        visitKey:
          type: string
          minLength: 1
